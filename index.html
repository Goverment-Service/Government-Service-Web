<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Government Service Navigator</title>
    <meta name="description" content="Multi-platform system for delivering and managing digital government services. Backend API, Web Dashboard, Mobile App, and Agent Layer." />
    <meta name="theme-color" content="#1a56db" />

    <!-- Open Graph -->
    <meta property="og:title" content="Government Service Navigator" />
    <meta property="og:description" content="Multi-platform system for delivering and managing digital government services." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Start fetching the home page's LCP image before the JS bundle runs -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high';
        l.imageSrcset = '/img/gsn/gsn1-640.webp 640w, /img/gsn/gsn1-768.webp 768w, /img/gsn/gsn1-1024.webp 1024w';
        l.imageSizes = '(max-width: 900px) 100vw, 50vw';
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
